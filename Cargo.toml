[workspace]
resolver = "2"
members = [
    "crates/lllang-syntax",
    "crates/lllang-manifest",
    "crates/lllang-sema",
    "crates/lllang-mir",
    "crates/lllang-llvm",
    "crates/lllang-lsp",
    "crates/lang",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lllang-lang/llang"
authors = ["LLLang Contributors"]

[workspace.dependencies]
lllang-syntax = { path = "crates/lllang-syntax" }
lllang-manifest = { path = "crates/lllang-manifest" }
lllang-sema = { path = "crates/lllang-sema" }
lllang-mir = { path = "crates/lllang-mir" }
lllang-llvm = { path = "crates/lllang-llvm" }
lllang-lsp = { path = "crates/lllang-lsp" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
dashmap = "6"
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1"] }
cc = "1"
indexmap = "2"
